name: Verify and deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, mint a Pages token, deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Stage 8 safety: verification ALWAYS runs on every push, but deployment is
# opt-in via the repository variable PI_ATLAS_PAGES_DEPLOY=true. This keeps the
# existing live site recoverable until the browser-only migration has been
# verified end to end. No Rust toolchain is needed — the generated WASM
# bindings are committed under src/generated/pi-wasm/.
env:
  PI_ATLAS_DATASET_URL: ${{ vars.PI_ATLAS_DATASET_URL || 'data/pi-2m/' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Install π verifier dependency
        run: python3 -m pip install --disable-pip-version-check mpmath==1.4.1

      - name: Verify committed 2M π fixture
        run: npm run verify:pi

      - name: Build browser-only frontend
        env:
          # Pages serves from https://<user>.github.io/<repo>/ — relative URLs.
          VITE_BASE_PATH: ./
          VITE_PI_DATASET_URL: ${{ env.PI_ATLAS_DATASET_URL }}
        run: npm run build

      - name: Verify Pages artifact is self-contained
        run: bash scripts/verify_pages_artifact.sh dist "dist/${PI_ATLAS_DATASET_URL}"

      - run: npx playwright install --with-deps chromium

      # E2E runs against the same static build users get. The Rust service is
      # no longer started: search happens in the WASM Worker, chunks are static.
      - name: E2E against the browser-only build
        env:
          PI_ATLAS_E2E_PREVIEW_PORT: 4175
        run: npm run test:e2e

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify
    if: ${{ vars.PI_ATLAS_PAGES_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
