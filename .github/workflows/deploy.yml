name: Verify and deploy frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: verification only reads the repo; only the deploy job gets
# the Pages token scopes. PR checks must not queue behind a live deployment.
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false

# Stage 8 safety: verification ALWAYS runs on every push, but deployment is
# opt-in via the repository variable PI_ATLAS_PAGES_DEPLOY=true. This keeps the
# existing live site recoverable until the browser-only migration has been
# verified end to end. No Rust toolchain is needed — the generated WASM
# bindings are committed under src/generated/pi-wasm/.
env:
  PI_ATLAS_DATASET_URL: ${{ vars.PI_ATLAS_DATASET_URL || 'data/pi-2m/' }}
  VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://samdanisayam.github.io/pi-atlas/' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Install π verifier dependency
        run: python3 -m pip install --disable-pip-version-check mpmath==1.4.1

      - name: Verify committed 2M π fixture
        run: npm run verify:pi

      # Verification/E2E always use the small 2M fixture: its assertions are
      # dataset-specific (e.g. "12" -> position 148, 1 / 19,800 occurrences).
      - name: Build verification frontend (2M)
        env:
          # Pages serves from https://<user>.github.io/<repo>/ — relative URLs.
          VITE_BASE_PATH: ./
          VITE_PI_DATASET_URL: data/pi-2m/
          VITE_SITE_URL: ${{ env.VITE_SITE_URL }}
        run: npm run build

      - name: Verify 2M Pages artifact is self-contained
        run: bash scripts/verify_pages_artifact.sh dist dist/data/pi-2m/

      - run: npx playwright install --with-deps chromium

      # E2E runs against the same code users get, on the 2M dataset the
      # assertions were written for. No Rust service: WASM Worker + static chunks.
      - name: E2E against the browser-only build
        env:
          PI_ATLAS_E2E_PREVIEW_PORT: 4175
        run: npm run test:e2e

      # The deployed bundle bakes in the dataset chosen by PI_ATLAS_DATASET_URL
      # (data/pi-2m/ by default, data/pi-1b/ for the full production deploy).
      # Typecheck already ran above, so only the Vite build is repeated.
      - name: Build deploy frontend (PI_ATLAS_DATASET_URL)
        env:
          VITE_BASE_PATH: ./
          VITE_PI_DATASET_URL: ${{ env.PI_ATLAS_DATASET_URL }}
          VITE_SITE_URL: ${{ env.VITE_SITE_URL }}
        run: npx vite build --outDir dist-deploy

      - name: Verify deploy Pages artifact is self-contained
        run: bash scripts/verify_pages_artifact.sh dist-deploy "dist-deploy/${PI_ATLAS_DATASET_URL}"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request'
        with:
          path: dist-deploy

  deploy:
    needs: verify
    if: ${{ github.event_name != 'pull_request' && vars.PI_ATLAS_PAGES_DEPLOY == 'true' }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
